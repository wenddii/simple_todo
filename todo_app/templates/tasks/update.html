<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Task</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 500px;">

    <h3 class="text-center mb-3">Update Task</h3>

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Task Title</label>
        {{ form.title }}
      </div>

      <div class="form-check mb-3">
        {{ form.complete }}
        <label class="form-check-label">Completed</label>
      </div>

      <button type="submit" class="btn btn-warning w-100">Update Task</button>
    </form>

    <a href="{% url 'list' %}" class="btn btn-link mt-3 text-center">Back to list</a>

  </div>
</div>

</body>
</html>
